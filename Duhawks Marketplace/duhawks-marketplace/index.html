
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duhawks Marketplace | Home</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="home">

    <header class="container py-3">

        <a class="brand" href="index.html">
            ◉ Duhawks Marketplace
        </a>

        <h1 class="h4 mt-3">Home</h1>

    </header>


    <main class="container pb-5">

        
        <section class="hero p-4 rounded-4 mb-4">

            <p class="small text-uppercase">
                Loras College student marketplace
            </p>

            <h2>Find what you need for campus life.</h2>

            <p>
                Browse secondhand essentials from fellow Duhawks.
            </p>

            <a href="search.html" class="btn btn-light">
                Explore listings →
            </a>

        </section>

  
        <section>

            <h2 class="h5">Browse by Space</h2>

            <!-- Category Buttons -->
            <div class="d-flex gap-2 flex-wrap mb-3">

                <a class="btn btn-outline-secondary btn-sm"
                   href="search.html">
                    All
                </a>

                <a class="btn btn-outline-secondary btn-sm"
                   href="category.html?category=Books">
                    Books
                </a>

                <a class="btn btn-outline-secondary btn-sm"
                   href="category.html?category=Kitchen">
                    Kitchen
                </a>

                <a class="btn btn-outline-secondary btn-sm"
                   href="category.html?category=House">
                    House
                </a>

            </div>

            <div
                class="row g-3"
                id="featured-products"
                aria-live="polite">
            </div>

        </section>

    </main>

   
    <nav class="bottom-nav" aria-label="Primary navigation">

        <a class="active" href="index.html">
            ⌂
            <span>Home</span>
        </a>

        <a href="search.html">
            ⌕
            <span>Search</span>
        </a>

        <a href="search.html#student-note">
            ♙
            <span>Profile</span>
        </a>

        <a href="category.html#saved">
            ♡
            <span>Saved</span>
        </a>

        <a href="category.html#cart">
            🛒
            <span>
                Cart <b class="cart-count">0</b>
            </span>
        </a>

    </nav>


    <script src="assets/js/app.js" defer></script>

</body>
</html>
