
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duhawks Marketplace | Listings</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

   
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="category">

   
    <header class="container py-3">

        <a class="brand" href="index.html">
            ◉ Duhawks Marketplace
        </a>

        <h1 class="h4 mt-3">

            <a class="back-link" href="search.html">
                ←
            </a>

            <span id="results-heading">
                Working Table
            </span>

        </h1>

    </header>

   
    <main class="container pb-5">

        <!-- Buying Options -->
        <section class="note mb-3">

            <strong>Buying options</strong>

            <p class="mb-2">
                Local student pickup and messaging
                are planned features.
            </p>

            <label for="zip" class="form-label small">
                ZIP code (optional demo field)
            </label>

            <input
                id="zip"
                class="form-control form-control-sm"
                maxlength="5"
                inputmode="numeric"
                placeholder="e.g. 52001"
            >

        </section>

    
        <div class="row g-2 mb-3">

            <!-- Sort Products -->
            <div class="col-6">

                <label class="form-label small" for="sort">
                    Sort
                </label>

                <select class="form-select form-select-sm" id="sort">

                    <option value="default">
                        Featured
                    </option>

                    <option value="low">
                        Price: low to high
                    </option>

                    <option value="high">
                        Price: high to low
                    </option>

                </select>

            </div>

          
            <div class="col-6">

                <label class="form-label small" for="max-price">
                    Max price
                </label>

                <select class="form-select form-select-sm" id="max-price">

                    <option value="all">
                        Any price
                    </option>

                    <option value="20">
                        $20
                    </option>

                    <option value="50">
                        $50
                    </option>

                    <option value="100">
                        $100
                    </option>

                </select>

            </div>

        </div>

  
        <div class="d-flex gap-2 flex-wrap mb-3">

            <span class="filter-label">
                Color: All
            </span>

            <span class="filter-label">
                Material: All
            </span>

        </div>

     
        <div
            id="product-results"
            class="row g-3"
            aria-live="polite">
        </div>

        <p
            id="result-status"
            class="small text-muted mt-3"
            role="status">
        </p>

        <section class="note mt-4" id="saved">

            <h2 class="h6">
                Saved items
            </h2>

            <div id="saved-list">
                No saved items yet.
            </div>

        </section>

     
        <section class="note mt-3" id="cart">

            <h2 class="h6">
                Cart (<span class="cart-count">0</span>)
            </h2>

            <div id="cart-list">
                Your cart is empty.
            </div>

            <p class="small text-muted mt-2 mb-0">
                Checkout is not implemented in this MVP.
            </p>

        </section>

    </main>

   
    <nav class="bottom-nav" aria-label="Primary navigation">

        <a href="index.html">
            ⌂
            <span>Home</span>
        </a>

        <a href="search.html">
            ⌕
            <span>Search</span>
        </a>

        <a href="search.html#student-note">
            ♙
            <span>Profile</span>
        </a>

        <a href="#saved">
            ♡
            <span>Saved</span>
        </a>

        <a href="#cart">
            🛒
            <span>
                Cart <b class="cart-count">0</b>
            </span>
        </a>

    </nav>

  
    <script src="assets/js/app.js" defer></script>

</body>
</html>
